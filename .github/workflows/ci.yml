name: Track original

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      break_validation:
        description: Deliberately corrupt the candidate manifest to prove safe failure
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: pstack-original-sync
  cancel-in-progress: false

jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Prepare isolated candidate
        shell: bash
        run: |
          candidate=$(mktemp -d "$RUNNER_TEMP/pstack-candidate.XXXXXX")
          git archive HEAD | tar -x -C "$candidate"
          echo "PSTACK_CANDIDATE=$candidate" >> "$GITHUB_ENV"
      - name: Install validation dependencies and pinned Codex
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: |
          npm ci --ignore-scripts
          npm install --global --ignore-scripts @openai/codex@0.163.0
      - name: Fetch original and regenerate candidate
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: node tools/sync.mjs
      - name: Deliberately break one check
        if: github.event_name == 'workflow_dispatch' && inputs.break_validation
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: node -e "const fs=require('node:fs');const p='plugins/pstack/.codex-plugin/plugin.json';const x=JSON.parse(fs.readFileSync(p));x.version='broken';fs.writeFileSync(p,JSON.stringify(x));"
      - name: Validate source, manifest schemas, skill parity, and hooks
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: npm run validate
      - name: Test failure boundaries
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: npm test
      - name: Prove Codex installation, hook injection, and adapter read
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: npm run smoke
      - name: Prove existing Codex installations upgrade
        working-directory: ${{ env.PSTACK_CANDIDATE }}
        run: node tools/upgrade-smoke.mjs
      - name: Publish only a verified source change on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          old_tree=$(node -p "require('./upstream/source.json').tree")
          new_tree=$(node -p "require(process.env.PSTACK_CANDIDATE+'/upstream/source.json').tree")
          if [ "$old_tree" = "$new_tree" ]; then
            echo 'Original source unchanged. Nothing to publish.'
            exit 0
          fi
          for path in upstream plugins .agents/plugins/marketplace.json VERSION package.json package-lock.json docs/overlay-files.md; do
            rm -rf -- "$path"
            cp -a -- "$PSTACK_CANDIDATE/$path" "$path"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git add -- upstream plugins .agents/plugins/marketplace.json VERSION package.json package-lock.json docs/overlay-files.md
          git commit --only -m "Track original pstack $(cat VERSION)" -- upstream plugins .agents/plugins/marketplace.json VERSION package.json package-lock.json docs/overlay-files.md
          git push origin HEAD:main
      - name: Open or update the single failure issue
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
          PSTACK_FAILURE_PROOF: ${{ inputs.break_validation }}
        run: node tools/failure-issue.mjs
      - name: Remove candidate
        if: always()
        shell: bash
        run: |
          if [ -n "${PSTACK_CANDIDATE:-}" ]; then
            rm -rf -- "$PSTACK_CANDIDATE"
          fi
